name: Record a live run
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write  # creates the change-request label

jobs:
  record:
    runs-on: ubuntu-latest
    concurrency: change-requests  # shares the Contentful space with the issue handler
    env:
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_API_HOST: ${{ vars.CONTENTFUL_API_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Create the change-request label the issue form applies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create change-request --color 1d4ed8 --force -R "$GITHUB_REPOSITORY"
      - name: Check the keys are set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || (echo "Add the ANTHROPIC_API_KEY repo secret first" && exit 1)
          test -n "$CONTENTFUL_CMA_TOKEN" || (echo "Add the CONTENTFUL_CMA_TOKEN repo secret first" && exit 1)
          test -n "$CONTENTFUL_SPACE_ID" || (echo "Add the CONTENTFUL_SPACE_ID repo variable first" && exit 1)
      - name: Check the Contentful token can reach the space
        env:
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
        run: |
          host="${CONTENTFUL_API_HOST:-https://api.contentful.com}"
          tok="$(printf '%s' "$CONTENTFUL_CMA_TOKEN" | tr -d '[:space:]')"
          echo "token starts with: ${tok:0:6}  length: ${#tok}  host: $host"
          curl -s -H "Authorization: Bearer $tok" "$host/users/me" | python -c "import json,sys; d=json.load(sys.stdin); print('users/me:', d.get('sys',{}).get('id') or d)"
          echo "space id length: ${#CONTENTFUL_SPACE_ID}"
          curl -s -H "Authorization: Bearer $tok" "$host/organizations" | python -c "import json,sys; d=json.load(sys.stdin); print('orgs:', [(o['name'], o['sys']['id']) for o in d.get('items', [])] or d)"
          curl -s -H "Authorization: Bearer $tok" "$host/spaces" | python -c "import json,sys; d=json.load(sys.stdin); print('spaces:', [(x['name'], x['sys']['id']) for x in d.get('items', [])] or d)"
          curl -s -H "Authorization: Bearer $tok" "$host/spaces/$CONTENTFUL_SPACE_ID" | python -c "import json,sys; d=json.load(sys.stdin); print('space:', d.get('name') or d)"
      - name: Create the content type and the ten pages in Contentful
        env:
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
        run: page-change-agent seed --yes
      - name: Live run, 30 tickets x 3, with the judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
        run: |
          rm -f recordings/*.jsonl
          GOLIVE_LIVE=1 golive run evals/tickets/golive.live.yml --out reports/tickets && rc=0 || rc=$?
          echo "exit code: $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          cat reports/tickets/report.md >> "$GITHUB_STEP_SUMMARY"
          test "$(wc -l < recordings/tickets_agent.jsonl)" -eq 90
          test "$rc" = "0" || (echo "The live run did not pass; nothing published." && exit 1)
      - name: Put the pages back to their starting copy
        env:
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
        run: page-change-agent seed --yes
      - name: Rebuild the demo page from the recordings
        run: python scripts/build_demo.py
      - name: Commit recordings and demo, publish Pages
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git add recordings docs
          git commit -m "Record a live run and rebuild the demo"
          git push
          git fetch origin gh-pages || true
          parent=$(git rev-parse -q --verify origin/gh-pages >/dev/null && echo "-p origin/gh-pages" || true)
          c=$(git commit-tree "$(git rev-parse HEAD:docs)" $parent -m "Publish the demo page")
          git push origin "$c:refs/heads/gh-pages"
      - name: Run CI on the new commit (pushes made by this workflow do not trigger it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
      - name: Keep a failed run for diagnosis on its own branch (main and Pages stay as they were)
        if: failure()
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git checkout -B record/last-failed
          git add -f recordings reports || true
          git commit -qm "Failed live run, kept for diagnosis (not published)" || true
          git push -f origin record/last-failed

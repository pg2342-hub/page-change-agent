[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "page-change-agent"
version = "0.1.0"
description = "An AI agent that turns website change requests into reviewed CMS drafts, with compliance checks and a before/after diff"
requires-python = ">=3.10"
dependencies = ["golive-gate[claude]>=0.1.1,<0.2", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
page-change-agent = "pagechange.cli:main"

[tool.setuptools]
packages = ["pagechange"]

[tool.setuptools.package-data]
pagechange = ["editor_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pagechange"]
known-third-party = ["golive_gate"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo.py" = ["E501", "E731"]
